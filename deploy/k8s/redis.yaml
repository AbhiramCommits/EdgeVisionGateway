apiVersion: apps/v1
kind: Deployment
metadata:
  name: evg-redis
  namespace: edgevision
  labels:
    app: evg-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evg-redis
  template:
    metadata:
      labels:
        app: evg-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: evg-redis
  namespace: edgevision
spec:
  selector:
    app: evg-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
