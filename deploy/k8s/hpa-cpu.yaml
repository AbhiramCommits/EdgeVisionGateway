# Alternative CPU-based autoscaling, for clusters without a custom-metrics
# adapter. Do NOT apply this together with hpa.yaml: two HPAs targeting the same
# Deployment fight over replica count. This file is intentionally NOT listed in
# kustomization.yaml; see docs/DEPLOY.md for the swap procedure.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evg-gateway-cpu
  namespace: edgevision
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evg-gateway
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
