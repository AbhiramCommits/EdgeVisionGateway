# EXAMPLE ONLY. Replace every value before applying to a real cluster, or
# create this Secret from your secret manager with:
#   kubectl -n edgevision create secret generic evg-secrets \
#     --from-literal=postgres-dsn='postgres://user:pass@db:5432/evg?sslmode=disable' \
#     --from-literal=redis-addr='redis:6379' \
#     --from-literal=device-secret='<random 32+ bytes>' \
#     --from-literal=postgres-password='evg'
apiVersion: v1
kind: Secret
metadata:
  name: evg-secrets
  namespace: edgevision
type: Opaque
stringData:
  postgres-dsn: "postgres://evg:evg@evg-postgres:5432/evg?sslmode=disable"
  redis-addr: "evg-redis:6379"
  device-secret: "dev-secret-change-me"
  postgres-password: "evg"
